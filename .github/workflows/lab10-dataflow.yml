name: Lab 10 data-flow verification

on:
  push:
    paths:
      - "lab-10/lab10-dataflow/**"
      - ".github/workflows/lab10-dataflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-10/lab10-dataflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Record toolchain
        run: |
          mkdir -p results
          java -version 2>&1 | tee results/java-version.txt
          mvn -version 2>&1 | tee results/maven-version.txt
      - name: All-defs stage
        run: |
          mvn -B -Dtest=BonusTest#allDefs_T1_allDefinitionsExceptInitialScore+allDefs_T2_initialScoreReachesBonusUse clean verify 2>&1 | tee results/mvn-verify-alldefs.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-alldefs.csv
      - name: All-DU-pairs stage
        run: |
          mvn -B -Dtest=GcdTest,BonusTest clean verify 2>&1 | tee results/mvn-verify-allpairs.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-allpairs.csv
      - name: Final complete suite
        run: |
          mvn -B clean verify 2>&1 | tee results/mvn-verify-final.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-final.csv
      - name: Mutation experiments
        shell: bash
        run: |
          set +e
          SRC=src/main/java/mn/edu/must/sqat/DataFlowTargets.java
          cp "$SRC" /tmp/DataFlowTargets.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          s=p.read_text()
          s=s.replace("streak = streak + 1;", "streak = streak;")
          p.write_text(s)
          PY
          mvn -B -Dtest=BonusTest test > results/mvn-test-M1.txt 2>&1
          echo $? > results/mutant-M1-exit.txt
          cp /tmp/DataFlowTargets.java "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          s=p.read_text().replace("best = streak;", "best = present;")
          p.write_text(s)
          PY
          mvn -B -Dtest=BonusTest test > results/mvn-test-M2.txt 2>&1
          echo $? > results/mutant-M2-exit.txt
          cp /tmp/DataFlowTargets.java "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          s=p.read_text().replace("int score = 0;", "int total = present + best;\n        int score = 0;")
          p.write_text(s)
          PY
          mvn -B -Dtest=BonusTest test > results/mvn-test-M3.txt 2>&1
          echo $? > results/mutant-M3-exit.txt
          cp /tmp/DataFlowTargets.java "$SRC"
          exit 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-dataflow-results
          path: lab-10/lab10-dataflow/results/
          if-no-files-found: warn
