name: Lab 10 data-flow verification

on:
  push:
    paths:
      - "lab-10/lab10-dataflow/**"
      - ".github/workflows/lab10-dataflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-10/lab10-dataflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Record toolchain and clear stale evidence
        run: |
          mkdir -p results
          rm -f results/*.txt results/*.csv
          java -version 2>&1 | tee results/java-version.txt
          mvn -version 2>&1 | tee results/maven-version.txt
      - name: All-defs stage (minimum set)
        run: |
          mvn -B -Dtest=BonusTest#allDefs_T1_allDefinitionsExceptInitialScore+allDefs_T2_initialScoreReachesBonusUse clean verify 2>&1 | tee results/mvn-verify-alldefs.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-alldefs.csv
      - name: All-DU-pairs stage
        run: |
          mvn -B -Dtest=GcdTest,BonusTest#DU_* clean verify 2>&1 | tee results/mvn-verify-allpairs.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-allpairs.csv
      - name: Final complete suite
        run: |
          mvn -B clean verify 2>&1 | tee results/mvn-verify-final.txt
          cp target/site/jacoco/jacoco.csv results/jacoco-final.csv
      - name: Mutation experiments
        shell: bash
        run: |
          set +e
          SRC=src/main/java/mn/edu/must/sqat/DataFlowTargets.java
          cp "$SRC" /tmp/DataFlowTargets.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          p.write_text(p.read_text().replace("streak = streak + 1;", "streak = streak;"))
          PY
          mvn -B -Dtest=BonusTest test > results/mvn-test-M1.txt 2>&1
          M1=$?
          echo "$M1" > results/mutant-M1-exit.txt
          cp /tmp/DataFlowTargets.java "$SRC"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          p.write_text(p.read_text().replace("best = streak;", "best = present;"))
          PY
          mvn -B '-Dtest=BonusTest#DU_*' test > results/mvn-test-M2.txt 2>&1
          M2=$?
          echo "$M2" > results/mutant-M2-exit.txt
          mvn -B -Dtest=BonusTest#M2Kill_bestUpdateUsesStreak test > results/mvn-test-M2-kill.txt 2>&1
          M2K=$?
          echo "$M2K" > results/mutant-M2-kill-exit.txt
          cp /tmp/DataFlowTargets.java "$SRC"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/main/java/mn/edu/must/sqat/DataFlowTargets.java")
          p.write_text(p.read_text().replace("int score = 0;", "int total = present + best;\n        int score = 0;"))
          PY
          mvn -B -Dtest=BonusTest test > results/mvn-test-M3.txt 2>&1
          M3=$?
          echo "$M3" > results/mutant-M3-exit.txt
          mvn -B pmd:pmd > results/pmd-M3.txt 2>&1
          PMD=$?
          echo "$PMD" > results/pmd-M3-exit.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report=Path("target/pmd.xml")
          if not report.exists():
              raise SystemExit("PMD report was not generated")
          root=ET.parse(report).getroot()
          matches=[]
          for violation in root.findall(".//violation"):
              if violation.attrib.get("rule") == "UnusedLocalVariable":
                  matches.append((violation.attrib.get("beginline"), (violation.text or "").strip()))
          if not matches:
              raise SystemExit("PMD did not report the unused M3 local variable")
          print("PMD detected unused local:", matches)
          PY
          PMD_CHECK=$?
          cp /tmp/DataFlowTargets.java "$SRC"

          # Expected: M1 killed, M2 survives DU suite, M2 kill test kills it,
          # M3 survives runtime tests because its new definition is unused.
          test "$M1" -ne 0 && test "$M2" -eq 0 && test "$M2K" -ne 0 && test "$M3" -eq 0 && test "$PMD" -eq 0 && test "$PMD_CHECK" -eq 0
      - name: Commit fresh Maven and JaCoCo evidence
        if: success()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab-10/lab10-dataflow/results/
          if ! git diff --cached --quiet; then
            git commit -m "test(lab10): add fresh Maven and JaCoCo evidence"
            git push
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-dataflow-results
          path: results/
          if-no-files-found: warn
