name: Lab 10 verification

on:
  push:
    branches: [lab10-rebuild]
    paths-ignore:
      - "lab-10/lab10-dataflow/results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab10-rebuild-verification
  cancel-in-progress: false

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab10-rebuild
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Graphviz and render CFG
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -Tpng "lab-10/lab10-dataflow/cfg-bonus.dot" -o "lab-10/lab10-dataflow/cfg-bonus.png"

      - name: Capture all-defs run
        shell: bash
        run: |
          set -euo pipefail
          ROOT="lab-10/lab10-dataflow"
          TEST="$ROOT/src/test/java/mn/edu/must/sqat/BonusTest.java"
          cp "$TEST" /tmp/BonusTest-final.java
          git show 5ff511bc782822a3b01d11882293eb41ace79d32:"$TEST" > "$TEST"
          python3 - "$TEST" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          text = text.replace("assertEquals(8,", "assertEquals(3,", 1)
          text = text.replace("new int[]{1, 1, 1, 1, 1}, 6", "new int[]{1, 0, 1, 1, 1, 1, 1}, 7")
          text = text.replace("new int[]{1, 1, 1, 1, 1}, 5", "new int[]{1, 0, 1, 1, 1, 1, 1}, 6")
          p.write_text(text)
          PY
          mkdir -p "$ROOT/results"
          { java -version; mvn -version; } 2>&1 | tee "$ROOT/results/environment.txt"
          (cd "$ROOT" && mvn verify) 2>&1 | tee "$ROOT/results/mvn-verify-alldefs.txt"
          cp "$ROOT/target/site/jacoco/jacoco.csv" "$ROOT/results/jacoco-alldefs.csv"
          cp /tmp/BonusTest-final.java "$TEST"

      - name: Capture mutation test runs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="lab-10/lab10-dataflow"
          SOURCE="$ROOT/src/main/java/mn/edu/must/sqat/DataFlowTargets.java"
          cp "$SOURCE" /tmp/DataFlowTargets-original.java

          run_mutation() {
            name="$1"
            set +e
            (cd "$ROOT" && mvn test) 2>&1 | tee "$ROOT/results/mvn-test-$name.txt"
            status=${PIPESTATUS[0]}
            set -e
            cp /tmp/DataFlowTargets-original.java "$SOURCE"
            printf "\\nMaven exit status: %s\\n" "$status" >> "$ROOT/results/mvn-test-$name.txt"
          }

          sed -i '/streak = streak + 1;/d' "$SOURCE"
          run_mutation M1

          sed -i 's/best = streak;/best = present;/' "$SOURCE"
          run_mutation M2

          sed -i '/        int score = 0;/i\\        int total = present + best;' "$SOURCE"
          run_mutation M3

      - name: Capture final verification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="lab-10/lab10-dataflow"
          (cd "$ROOT" && mvn verify) 2>&1 | tee "$ROOT/results/mvn-verify-final.txt"
          cp "$ROOT/target/site/jacoco/jacoco.csv" "$ROOT/results/jacoco-final.csv"
          git diff --exit-code -- "$ROOT/src/main/java/mn/edu/must/sqat/DataFlowTargets.java"
          git diff --exit-code 0eee82b33ac6894679966879f2b88c119b704db6 HEAD -- "$ROOT/src/main/java/mn/edu/must/sqat/DataFlowTargets.java"

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab-10/lab10-dataflow/results lab-10/lab10-dataflow/cfg-bonus.png
          if ! git diff --cached --quiet; then
            git commit -m "Lab 10: add Maven and JaCoCo evidence"
            git pull --rebase origin lab10-rebuild
            git push origin HEAD:lab10-rebuild
          fi
